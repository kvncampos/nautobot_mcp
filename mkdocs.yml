site_name: Nautobot MCP Server
site_description: A Model Context Protocol (MCP) server for interacting with Nautobot APIs using semantic search and dynamic API requests
site_author: Kevin Campos
site_url: https://kvncampos.github.io/nautobot_mcp/
repo_name: kvncampos/nautobot_mcp
repo_url: https://github.com/kvncampos/nautobot_mcp
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/router-network

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Configuration: configuration.md
  - User Guide:
      - Architecture: architecture.md
      - MCP Tools: tools.md
      - Knowledge Base: knowledge-base.md
      - Examples: examples.md
  - Advanced:
      - API Reference: api-reference.md
      - Troubleshooting: troubleshooting.md
      - Development: development.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kvncampos/nautobot_mcp
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nautobot-mcp/
  version:
    provider: mike

extra_css:
  - assets/extra.css

copyright: Copyright &copy; 2024 Kevin Campos
